services:
  - type: web
    name: nakrutka-telegram-bot
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/orders
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: nakrutka-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: SMM_API_URL
        value: https://nawabsmm.com/api/v2
      - key: NAKRUTKA_API_KEY
        sync: false
      - key: ADMIN_CARD
        value: "9860 1766 2185 8958"
      - key: ADMIN_CARD_HOLDER
        value: "Jonibek"
      - key: ADMIN_TELEGRAM_ID
        value: "6657648192"
      - key: MIN_TOPUP_AMOUNT
        value: "5000"

databases:
  - name: nakrutka-db
    plan: free
    region: frankfurt
    databaseName: nakrutkadb
    user: postgres

