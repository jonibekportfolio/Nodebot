version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nakrutka_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jonibek_secure_pass_2026}
      POSTGRES_DB: nakrutkadb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: nakrutka_bot
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-jonibek_secure_pass_2026}@postgres:5432/nakrutkadb
    ports:
      - "3000:3000"

volumes:
  pgdata:

